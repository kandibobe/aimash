# Локальная dev-БД. Запуск: `docker compose up -d postgres` (или `make db-up`).
# Создаёт две роли: aimash (read-write для приложения/Alembic) и aimash_ro (read-only,
# для Postgres MCP — defense-in-depth поверх --access-mode=restricted).
#
# 🔒 D3: пароли БД НЕ лежат в git. POSTGRES_PASSWORD / POSTGRES_RO_PASSWORD берутся из .env
# (untracked) через `${VAR:?}` — при отсутствии `docker compose` ОТКАЗЫВАЕТ подниматься
# (fail-closed, правило #10), а не поднимается со всем известным паролем «aimash».
# ⚠️ На уже проинициализированном томе смена пароля требует ручного `ALTER ROLE aimash WITH
#    PASSWORD '…';` — иначе бот не подключится (docs/DEPLOYMENT.md).

# Сборка образа `aimash-core` описана ОДИН раз и переиспользуется scheduler/mcp/migrate.
# Telegram принимает Hermes gateway; legacy aiogram poller в topology v3 отсутствует.
# аргументам разъехаться, и какой из них выиграл в `aimash-bot`, зависит от порядка сборки.
# GIT_SHA — маркер версии внутри образа. `.dockerignore` исключает `.git`, поэтому
# `docker exec … git rev-parse` не работает в принципе: без этого аргумента вопрос «какой коммит
# сейчас в проде» отвечается только по времени сборки контейнера. Пусто ⇒ `unknown`, не отказ:
# локальная сборка версией не занимается. Проставляет CI/деплой (`.github/workflows/ci.yml`).
x-aimash-build: &aimash-build
  context: .
  dockerfile: Dockerfile
  args:
    GIT_SHA: ${GIT_SHA:-unknown}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    container_name: aimash-pg
    environment:
      POSTGRES_USER: aimash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен — задай в .env}
      POSTGRES_DB: aimash
      # Пароль read-only роли для init-скрипта (db/init/01-readonly-role.sh).
      AIMASH_RO_PASSWORD: ${POSTGRES_RO_PASSWORD:?POSTGRES_RO_PASSWORD обязателен — задай в .env}
    ports:
      # 5433 ТОЛЬКО на loopback (localhost): dev/alembic с хоста работают, но наружу (0.0.0.0) НЕ
      # светим — иначе Docker пробивает host-firewall через iptables. Внутри контейнера — 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - aimash_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimash -d aimash"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # B3: как и у бота — БД должна сама подниматься после падения/перезагрузки VPS. Без этого
    # упавший postgres остаётся мёртвым, а бот (depends_on healthy) уходит в бесконечный крэш-луп.
    restart: unless-stopped
    # Потолок ресурсов БД (co-located с ботом на 2 vCPU / 4 ГБ — БД не должна задушить бота).
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  # Одноразовая миграция схемы перед scheduler. MCP стартует по запросу Hermes поверх уже
  # подготовленной БД. Отдельный сервис заменяет скрытый side-effect запуска legacy bot.main.
  migrate:
    build: *aimash-build
    image: aimash-core
    container_name: aimash-migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.defaults
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aimash:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен — задай в .env}@postgres:5432/aimash
      TZ: UTC
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  # Фоновый scheduler живёт отдельно от Telegram/Hermes gateway.
  # Владение — advisory-lock роли `scheduler`: занято ⇒ этот процесс выходит ненулевым кодом
  # (restart подхватит, когда бот отпустит), а НЕ уходит в тихий standby.
  # ⚠️ Кнопочного слоя здесь нет по построению: порт `scheduler/delivery.py` не заполняется ⇒
  #    дайджесты уходят текстом, а thr-tune молчит (его сообщение целиком — предложение под тап).
  scheduler:
    image: aimash-core
    build: *aimash-build
    container_name: aimash-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Тот же порядок и файлы, что у бота: .env.defaults базой, .env (untracked) последним.
    env_file:
      - .env.defaults
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aimash:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен — задай в .env}@postgres:5432/aimash
      # Как у бота: APScheduler берёт локальную TZ контейнера, код трактует naive datetime как UTC.
      TZ: UTC
      PYTHONIOENCODING: utf-8
      KILL_SWITCH_FILE: /run/aimash-safety/KILL_SWITCH
    volumes:
      - ./runtime/safety:/run/aimash-safety:ro
    command: ["python", "-m", "scheduler"]
    restart: unless-stopped
    # Тот же HEALTHCHECK из образа (свежесть heartbeat) — энтрипоинт планировщика поднимает
    # `heartbeat_loop()` на своём loop, иначе контейнер был бы вечно unhealthy. Файл heartbeat — в
    # temp КОНТЕЙНЕРА (HEARTBEAT_FILE не задан), у бота свой: файловые системы разные.
    # Пик памяти — плановый xlsx-отчёт (openpyxl держит объектный граф); интерактивный deep-MCC
    # `/export` остаётся у бота, поэтому потолок ниже ботовского.
    mem_limit: 900m
    cpus: 0.5
    logging: *default-logging

  # Hermes MCP-сервер по stdio. НЕ поднимается штатным `up` (profiles) — только
  # по требованию Hermes: `docker compose --profile mcp run --rm --no-deps -T mcp`. Тот же образ и env,
  # что у бота (OAuth-кэш в БД, DATABASE_URL, GOOGLE_ADS_*, SECRETS_ENCRYPTION_KEY) — паритет окружения
  # без host-venv. docker-entrypoint.sh для не-`bot.main` команды миграции НЕ гоняет (exec "$@").
  # Hermes запускает этот сервис напрямую; legacy контейнер aimash-bot не требуется.
  mcp:
    profiles: ["mcp"]
    image: aimash-core
    build: *aimash-build
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Тот же порядок и файлы, что у бота: .env.defaults базой, серверный .env (untracked) последним.
    env_file:
      - .env.defaults
      - .env
    environment:
      # Как у бота: внутри compose-сети — postgres:5432 (НЕ хостовый 5433); пароль той же переменной.
      DATABASE_URL: postgresql+asyncpg://aimash:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен — задай в .env}@postgres:5432/aimash
      TZ: UTC
      PYTHONIOENCODING: utf-8    # Windows/utf8 не при чём здесь, но stdout MCP — строго utf-8
      KILL_SWITCH_FILE: /run/aimash-safety/KILL_SWITCH
    volumes:
      - ./runtime/safety:/run/aimash-safety:ro
    command: ["python", "-m", "mcp_server"]
    restart: "no"               # запускается через `run --rm` на сессию Hermes, не long-running
    mem_limit: 1200m
    cpus: 1.0
    logging: *default-logging
    # Hermes gateway живёт в systemd на хосте; здесь проверяется его живой stdio MCP-процесс.
    # Проверка импортирует фактический registry с теми же env/settings, что использует PID 1.
    healthcheck:
      test: ["CMD", "python", "-c", "from mcp_server.server import expected_tool_names; assert expected_tool_names()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # C1: АВТОБЭКАП БД. Раньше scripts/backup_db.sh надо было ставить в host-cron ВРУЧНУЮ — по факту он
  # часто НЕ был запущен, а в БД oauth_tokens (шифр. refresh-токены) + audit_log (денежный реестр).
  # Сайдкар делает pg_dump -Fc сразу на старте и далее раз в сутки в ./backups (хост-том, переживает
  # пересоздание контейнера и `git reset --hard` — папка untracked), ротация BACKUP_RETAIN дампов.
  # ⚠️ Локальный том — НЕ офсайт: для катастрофоустойчивости выгружай ./backups наружу (rsync/S3/rclone).
  # ⚠️ SECRETS_ENCRYPTION_KEY бэкапь ОТДЕЛЬНО от дампа (docs/BACKUP.md): без него oauth_tokens в дампе
  #    не расшифруются — потребуется повторная регистрация аккаунтов (scripts/register_account.py).
  backup:
    image: postgres:16
    container_name: aimash-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен — задай в .env}
      BACKUP_RETAIN: "14"
      TZ: UTC
    volumes:
      - ./backups:/backups
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    # Дамп сразу на старте, затем sleep 24ч. Сбой pg_dump не роняет цикл (|| echo). $$ = литеральный
    # $ для shell (compose съедает одиночный $). Ротация: оставить последние BACKUP_RETAIN дампов.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S);
          out="/backups/aimash-$$ts.dump";
          echo "[backup] pg_dump -> $$out";
          if pg_dump -Fc -h postgres -U aimash -d aimash > "$$out"; then
            echo "[backup] ok";
          else
            echo "[backup] FAILED"; rm -f "$$out";
          fi;
          ls -1t /backups/aimash-*.dump 2>/dev/null | tail -n +$$(( $${BACKUP_RETAIN:-14} + 1 )) | xargs -r rm -f;
          sleep 86400;
        done
    logging: *default-logging

volumes:
  aimash_pgdata:
