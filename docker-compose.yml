# Локальная dev-БД. Запуск: `docker compose up -d postgres` (или `make db-up`).
# Создаёт две роли: aimash (read-write для приложения/Alembic) и aimash_ro (read-only,
# для Postgres MCP — defense-in-depth поверх --access-mode=restricted).
services:
  postgres:
    image: postgres:16
    container_name: aimash-pg
    environment:
      POSTGRES_USER: aimash
      POSTGRES_PASSWORD: aimash
      POSTGRES_DB: aimash
    ports:
      # 5433 ТОЛЬКО на loopback (localhost): dev/alembic с хоста работают, но наружу (0.0.0.0) НЕ
      # светим — иначе Docker пробивает host-firewall через iptables. Внутри контейнера — 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - aimash_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimash -d aimash"]
      interval: 5s
      timeout: 3s
      retries: 10
    # B3: как и у бота — БД должна сама подниматься после падения/перезагрузки VPS. Без этого
    # упавший postgres остаётся мёртвым, а бот (depends_on healthy) уходит в бесконечный крэш-луп.
    restart: unless-stopped
    # Потолок ресурсов БД (co-located с ботом на 2 vCPU / 4 ГБ — БД не должна задушить бота).
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # Бот (Telegram long-poll + планировщик). Запуск всего: `docker compose up --build`.
  # Секреты — из .env (env_file), в образ НЕ запекаются. Миграции применяются АВТОМАТИЧЕСКИ
  # при старте (docker-entrypoint.sh → alembic upgrade head, fail-fast если миграция падает).
  # Прогнать вручную при необходимости: docker compose run --rm bot alembic upgrade head
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aimash-bot
    depends_on:
      postgres:
        condition: service_healthy
    # Порядок важен: .env.defaults (tracked, несекретные операционные дефолты) — базой;
    # .env (untracked, секреты + оверрайды) — ПОСЛЕДНИМ, поэтому переопределяет дефолты.
    env_file:
      - .env.defaults
      - .env
    environment:
      # ВНУТРИ сети compose — имя сервиса + порт 5432 (НЕ хостовый 5433!).
      DATABASE_URL: postgresql+asyncpg://aimash:aimash@postgres:5432/aimash
      # Фиксируем UTC: APScheduler берёт локальную TZ контейнера, а код трактует naive datetime как
      # UTC. Явный TZ=UTC делает cron детерминированным независимо от хоста: REPORT_SCHEDULE
      # '0 1 * * *' = 01:00 UTC = 10:00 JST (10 утра по Японии).
      TZ: UTC
    restart: unless-stopped
    # Потолок ресурсов одного инстанса (long-poll бот лёгкий; лимит ловит утечку/раздувание).
    # docker compose v2 (не-swarm) применяет deploy.resources.limits для memory/cpus.
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    # Ротация логов: без неё json-file растёт безгранично и забивает диск VPS.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # C1: АВТОБЭКАП БД. Раньше scripts/backup_db.sh надо было ставить в host-cron ВРУЧНУЮ — по факту он
  # часто НЕ был запущен, а в БД oauth_tokens (шифр. refresh-токены) + audit_log (денежный реестр).
  # Сайдкар делает pg_dump -Fc сразу на старте и далее раз в сутки в ./backups (хост-том, переживает
  # пересоздание контейнера и `git reset --hard` — папка untracked), ротация BACKUP_RETAIN дампов.
  # ⚠️ Локальный том — НЕ офсайт: для катастрофоустойчивости выгружай ./backups наружу (rsync/S3/rclone).
  # ⚠️ SECRETS_ENCRYPTION_KEY бэкапь ОТДЕЛЬНО от дампа (docs/BACKUP.md): без него oauth_tokens в дампе
  #    не расшифруются — потребуется повторная регистрация аккаунтов (scripts/register_account.py).
  backup:
    image: postgres:16
    container_name: aimash-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: aimash
      BACKUP_RETAIN: "14"
      TZ: UTC
    volumes:
      - ./backups:/backups
    restart: unless-stopped
    # Дамп сразу на старте, затем sleep 24ч. Сбой pg_dump не роняет цикл (|| echo). $$ = литеральный
    # $ для shell (compose съедает одиночный $). Ротация: оставить последние BACKUP_RETAIN дампов.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S);
          out="/backups/aimash-$$ts.dump";
          echo "[backup] pg_dump -> $$out";
          if pg_dump -Fc -h postgres -U aimash -d aimash > "$$out"; then
            echo "[backup] ok";
          else
            echo "[backup] FAILED"; rm -f "$$out";
          fi;
          ls -1t /backups/aimash-*.dump 2>/dev/null | tail -n +$$(( $${BACKUP_RETAIN:-14} + 1 )) | xargs -r rm -f;
          sleep 86400;
        done
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  aimash_pgdata:
