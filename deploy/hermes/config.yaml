# ─────────────────────────────────────────────────────────────────────────────
# Hermes Agent — ЭТАЛОН конфига (ДЕФОЛТНЫЙ профиль).
# ⚠️ ЭТО ЭТАЛОН СТРУКТУРЫ, не файл для слепой замены live-конфига: на VPS есть host-local model/
#    dashboard settings и закрытые поля. Деплой меняет только Aimash surface + trusted plugin через
#    `sync_aimash_surface.py`, сохраняя остальные live-ключи.
# ─────────────────────────────────────────────────────────────────────────────

model:
  provider: openai-codex
  default: gpt-5.6-terra

# Не передавать клиентский/Google Ads контекст внешнему провайдеру при отказе Codex.
# Сбой основного runtime должен быть явным и безопасным, а не молча уходить в OpenRouter.
fallback_providers: []

agent:
  max_turns: 20
  restart_drain_timeout: 180
  tool_use_enforcement: auto
  disabled_toolsets:
    - homeassistant
    - spotify
    - video_gen
    - x_search
    - yuanbao
    - tts
  reasoning_effort: medium

browser:
  cloud_provider: local

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 3
    same_tool_failure: 4
    idempotent_no_progress: 3

compression:
  enabled: true
  threshold: 0.15
  target_ratio: 0.10
  protect_last_n: 12
  protect_first_n: 0

# Short-term dialogue is a working set, not the client knowledge base. A day of inactivity starts a
# fresh session; ended transcripts stay searchable from CLI for 30 days, then are removed from state.db.
session_reset:
  mode: idle
  idle_minutes: 1440
  notify: true

sessions:
  auto_prune: true
  retention_days: 30
  vacuum_after_prune: true
  min_interval_hours: 24

auxiliary:
  transient_retries: 2
  vision:
    provider: openai-codex
    model: gpt-5.4
  web_extract:
    provider: openai-codex
    model: gpt-5.4
  compression:
    provider: openai-codex
    model: gpt-5.6-sol
  approval:
    provider: openai-codex
    model: gpt-5.6-sol
  title_generation:
    enabled: true
    provider: openai-codex
    model: gpt-5.4
  memory_query_rewrite:
    provider: openai-codex
    model: gpt-5.4
  curator:
    provider: openai-codex
    model: gpt-5.6-sol

display:
  show_cost: true
  platforms:
    telegram:
      tool_progress: log
  runtime_footer:
    enabled: true
    fields: '["model", "context_pct"]'
  tool_progress: log

dashboard:
  basic_auth:
    username: aimash
    # password_hash/secret — живут в ~/.hermes/.env, сюда не копировать
    # Если меняешь — смержи руками

privacy:
  redact_pii: true

memory:
  memory_enabled: true
  user_profile_enabled: true

delegation:
  model: gpt-5.6-sol
  provider: openai-codex
  inherit_mcp_toolsets: true
  max_iterations: 30
  reasoning_effort: high
  max_concurrent_children: 3
  max_spawn_depth: 1
  orchestrator_enabled: true
  subagent_auto_approve: true

skills:
  inline_shell: false
  guard_agent_created: true
  write_approval: true
  platform_disabled:
    telegram:
      - ad-master-context
      - ad-master-cron-ops
      - ad-master-routing
      - ad-master-self-learning
      - admaster-operations
      - aimash-architecture
      - aimash-development
      - quant

plugins:
  enabled:
    - aimash_trusted_transport

approvals:
  mode: manual
  cron_mode: deny
  deny:
    - rm -rf *
    - sudo *
    - docker *
    - git push*
  destructive_slash_confirm: false

command_allowlist:
  - execute_code
  - overwrite project env/config via redirection
  - recursive delete
  - overwrite project env/config file
  - script execution via -e/-c flag

security:
  redact_secrets: true

gateway:
  platforms:
    telegram:
      allow_from:
        - '787132457'
        - '1674890775'
      group_allow_from:
        - '787132457'
        - '1674890775'
      require_mention: false
      guest_mode: false
      extra:
        group_topics: '[{"chat_id": "-1004443550627", "topics": [{"name": "general",
          "thread_id": 1, "skill": "ad-master-agent"}, {"name": "google-ads", "thread_id":
          153, "skill": "google-ads-worker"}, {"name": "meta-ads", "thread_id": 154,
          "skill": "meta-ads-worker"}, {"name": "tiktok-ads", "thread_id": 155, "skill":
          "tiktok-ads-worker"}, {"name": "approvals-and-audits", "thread_id": 156,
          "skill": "ad-master-agent"}]}]'

onboarding:
  seen:
    busy_input_prompt: true

_config_version: 33

provider_routing:
  require_parameters: true
  data_collection: deny

# Progressive disclosure is supported by the pinned v0.19.0 runtime. Keep it explicit so an
# upstream default change cannot silently expose all MCP schemas on every turn. Rollback: set
# enabled=off; no MCP registry or money-path code changes are required.
tools:
  tool_search:
    enabled: auto
    threshold_pct: 5
    search_default_limit: 5
    max_search_limit: 20

# Kanban remains installed but its dispatcher is fail-closed until isolated READ-only profiles have
# passed the golden trace corpus. Enabling the CLI toolset alone must not start autonomous workers.
kanban:
  dispatch_in_gateway: false
  auto_decompose: false
  max_in_progress: 2
  max_in_progress_per_profile: 1

mcp_servers:
  aimash:
    # Wrapper serializes the one named artifact container and removes it only after the previous
    # stdio owner is gone. This lets automatic reconnect recover from an orphan without racing the
    # active gateway connection.
    command: /bin/sh
    args:
      - /opt/aimash/scripts/run_hermes_mcp.sh
    timeout: 120
    connect_timeout: 30
    tools:
      include:             # exact registry; guarded by tests/test_hermes_isolation.py
        - get_bridge_capabilities
        - list_accounts
        # Универсальный READ: Hermes сам пишет GAQL; Google Ads валидирует его синтаксис.
        - execute_google_ads_query
        - get_account_audit
        - analyze_account
        - get_change_history
        # Р6: журнал правок в САМОМ Google Ads (кто/когда/через какой канал) — не путать с
        # get_change_history, тот про НАШ audit-trail. Google о чужих правках не уведомляет.
        - get_account_changes
        - keyword_ideas
        # Технические/локальные reads, которые нельзя выразить одним GAQL.
        - get_quota
        - recall_client
        # §8 MCC: сводка по всем дочерним + глубокий разбор. Список обязан совпадать с
        # READ_TOOL_FUNCS РОВНО (require_registered_surface сверяет на равенство, не на вхождение):
        # добавили инструмент в код и забыли здесь — Hermes его не увидит и работать будет «почти».
        - get_mcc_summary
        - get_mcc_deep
        # Bot-free professional workflows: artifact report delivery, keyword/RSA primitives and
        # structured client-profile/crawl reads. Every function keeps the same read-account lock.
        - build_report
        - build_mcc_report
        - export_keyword_report
        - seed_keywords
        - cluster_keywords
        - filter_keyword_relevance
        - suggest_negatives
        - parse_keywords_input
        - generate_rsa
        - validate_adcopy
        - build_display_path
        - get_client_card
        - list_client_facts_structured
        - list_site_pages
        - get_crawl_status
        # Bias-for-Action: typed actions execute in the current trusted turn. Only a critical
        # global update_budget returns APPROVAL_REQUIRED and continues through execute_confirmed.
        - update_budget
        - update_bid
        - update_keyword_bid
        - set_bidding_strategy
        - add_keywords
        - remove_keywords
        - add_negative_keywords
        - remove_negative_keywords
        - add_negatives_to_shared_set
        - attach_shared_set
        - pause_campaign
        - resume_campaign
        - launch_campaign
        - update_campaign
        - remove_campaign
        - set_campaign_network
        - set_campaign_display_network
        - set_campaign_geo_target_type
        - pause_ad_group
        - resume_ad_group
        - remove_ad_group
        - pause_ad
        - resume_ad
        - remove_ad
        - set_geo_proximity
        - set_geo_location
        - attach_audience
        - detach_audience
        - create_rsa
        - create_search_campaign
        - create_gdn_campaign
        - create_demand_gen_campaign
        - create_video_campaign
        - create_app_campaign
        - add_sitelinks
        - add_callouts
        - add_structured_snippets
        - attach_image_asset
        - add_call_asset
        - add_promotion
        - add_price_asset
        - remove_asset_link
        # One bounded package of 2-10 rollbackable operations. This creates one pending proposal;
        # execution still requires the normal trusted reply -> execute_confirmed CAS path.
        - composite_change
        - profile_change
        - profile_clear
        - list_pending_proposals
        - cancel_proposal
        # Private control plane: trusted HMAC turn + account scope + atomic transition; no RBAC blocker.
        - list_decisions
        - update_decision
        - list_incidents
        - update_incident
        # Only durable/transport state that Hermes cannot keep in its own dialogue context.
        - start_keyword_research
        - read_keyword_sheet
        - create_search_term_review
        - read_search_term_review
        - build_monthly_pdf
        - ingest_media
        - start_client_crawl
        - execute_confirmed
  tavily:
    command: npx
    args:
      - -y
      - tavily-mcp
    timeout: 30
    tools:
      include:
        - tavily_search
        - tavily_extract
        - tavily_research
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - file
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - video
    - web
    - yuanbao
  # Typed MCP servers remain available by default. Host/code mutation tools are deliberately CLI-only.
  telegram:
    - clarify
    - cronjob
    - delegation
    - memory
    - skills
    - todo
    - vision
    - web

known_plugin_toolsets:
  cli:
    - spotify
