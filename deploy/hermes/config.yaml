# ─────────────────────────────────────────────────────────────────────────────
# Hermes Agent — ЭТАЛОН конфига (ДЕФОЛТНЫЙ профиль).
# ⚠️ ЭТО ЭТАЛОН СТРУКТУРЫ, не файл для слепой замены live-конфига: на VPS есть host-local model/
#    dashboard settings и закрытые поля. Деплой меняет только Aimash surface + trusted plugin через
#    `sync_aimash_surface.py`, сохраняя остальные live-ключи.
# ─────────────────────────────────────────────────────────────────────────────

model:
  provider: openai-codex
  default: gpt-5.6-sol

# Резервная цепочка Hermes v0.19.0 уходит с Codex OAuth на отдельный OpenRouter-ключ:
# переживает отказ Codex или конкретной fallback-модели, но требует рабочие credentials обоих providers.
fallback_providers:
  - provider: openrouter
    model: deepseek/deepseek-v4-flash
  - provider: openrouter
    model: google/gemini-3.1-flash-lite

agent:
  max_turns: 40
  restart_drain_timeout: 180
  tool_use_enforcement: auto
  disabled_toolsets:
    - homeassistant
    - spotify
    - video_gen
    - x_search
    - yuanbao
    - tts
  reasoning_overrides:
    google/gemini-3.1-flash-lite: none
    deepseek/deepseek-v4-flash: ''
  reasoning_effort: high

browser:
  cloud_provider: local

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 3
    same_tool_failure: 4
    idempotent_no_progress: 3

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3

auxiliary:
  transient_retries: 2
  vision:
    provider: openrouter
    model: google/gemini-3.1-flash-lite
  web_extract:
    provider: openrouter
    model: google/gemini-3.1-flash-lite
  compression:
    provider: openrouter
    model: google/gemini-3.1-flash-lite
  approval:
    provider: openrouter
    model: google/gemini-3.1-flash-lite
  title_generation:
    enabled: true
    provider: openrouter
    model: google/gemini-3.1-flash-lite
  memory_query_rewrite:
    provider: openrouter
    model: google/gemini-3.1-flash-lite
  curator:
    provider: openrouter
    model: google/gemini-3.1-flash-lite

display:
  show_cost: true
  platforms:
    telegram:
      tool_progress: log
  runtime_footer:
    enabled: true
    fields: '["model", "context_pct"]'
  tool_progress: log

dashboard:
  basic_auth:
    username: aimash
    # password_hash/secret — живут в ~/.hermes/.env, сюда не копировать
    # Если меняешь — смержи руками

privacy:
  redact_pii: true

memory:
  memory_enabled: true
  user_profile_enabled: true

delegation:
  model: gpt-5.6-sol
  provider: openai-codex
  inherit_mcp_toolsets: true
  max_iterations: 30
  reasoning_effort: high
  max_concurrent_children: 3
  max_spawn_depth: 1
  orchestrator_enabled: true
  subagent_auto_approve: false

skills:
  inline_shell: false
  guard_agent_created: true
  write_approval: true
  platform_disabled:
    telegram:
      - ad-master-context
      - ad-master-cron-ops
      - ad-master-routing
      - ad-master-self-learning
      - admaster-operations
      - aimash-architecture
      - aimash-development
      - quant

plugins:
  enabled:
    - aimash_trusted_transport

approvals:
  mode: manual
  cron_mode: deny
  deny:
    - rm -rf *
    - sudo *
    - docker *
    - git push*
  destructive_slash_confirm: false

command_allowlist:
  - execute_code
  - overwrite project env/config via redirection
  - recursive delete
  - overwrite project env/config file
  - script execution via -e/-c flag

security:
  redact_secrets: true

gateway:
  platforms:
    telegram:
      allow_from:
        - '787132457'
        - '1674890775'
      group_allow_from:
        - '787132457'
        - '1674890775'
      require_mention: true
      guest_mode: false
      extra:
        group_topics: '[{"chat_id": "-1004443550627", "topics": [{"name": "general",
          "thread_id": 1, "skill": "ad-master-agent"}, {"name": "google-ads", "thread_id":
          153, "skill": "google-ads-worker"}, {"name": "meta-ads", "thread_id": 154,
          "skill": "meta-ads-worker"}, {"name": "tiktok-ads", "thread_id": 155, "skill":
          "tiktok-ads-worker"}, {"name": "approvals-and-audits", "thread_id": 156,
          "skill": "ad-master-agent"}]}]'

onboarding:
  seen:
    busy_input_prompt: true

_config_version: 33

provider_routing:
  require_parameters: true
  data_collection: deny

mcp_servers:
  aimash:
    command: docker
    args:
      - exec
      - -i
      - aimash-bot
      - python
      - -m
      - mcp_server
    timeout: 120
    connect_timeout: 30
    tools:
      include:             # exact registry; guarded by tests/test_hermes_isolation.py
        - get_bridge_capabilities
        - list_accounts
        - get_campaign_stats
        - get_adgroup_stats
        - get_keywords
        - get_ads
        - get_search_terms
        - get_negatives
        - get_budgets
        - get_auction_insights
        - get_account_audit
        - get_change_history
        # Р6: журнал правок в САМОМ Google Ads (кто/когда/через какой канал) — не путать с
        # get_change_history, тот про НАШ audit-trail. Google о чужих правках не уведомляет.
        - get_account_changes
        - keyword_ideas
        # Структура и настройки кампаний («было» для правок, не метрики): список кампаний, гео/языки,
        # настройки по имени с группами и RSA, стратегия ставок, разбивки device/network/day,
        # аудитории (доступные и прикреплённые) и остаток нашей суточной квоты операций.
        - list_campaigns
        - read_campaign_targeting
        - read_campaign_config
        - get_bidding_strategy
        - get_report_breakdown
        - list_audiences
        - list_attached_audiences
        - get_quota
        - recall_client
        # §8 MCC: сводка по всем дочерним + глубокий разбор. Список обязан совпадать с
        # READ_TOOL_FUNCS РОВНО (require_registered_surface сверяет на равенство, не на вхождение):
        # добавили инструмент в код и забыли здесь — Hermes его не увидит и работать будет «почти».
        - get_mcc_summary
        - get_mcc_deep
        # Общие списки минус-слов нужны PLAN-обёрткам как READ-контекст; сам инструмент не мутирует.
        - list_negative_shared_sets
        # Bot-free professional workflows: artifact report delivery, keyword/RSA primitives and
        # structured client-profile/crawl reads. Every function keeps the same read-account lock.
        - build_report
        - seed_keywords
        - cluster_keywords
        - filter_keyword_relevance
        - suggest_negatives
        - parse_keywords_input
        - generate_rsa
        - validate_adcopy
        - build_display_path
        - get_client_card
        - list_client_facts_structured
        - list_site_pages
        - get_crawl_status
        # PLAN создаёт только pending proposal. Каждый вызов проходит HMAC trusted-turn wrapper;
        # execute не принимает identity/id от модели и требует реальный Telegram reply-якорь.
        - propose_budget_change
        - propose_bid_change
        - propose_keyword_bid_change
        - propose_set_bidding_strategy
        - propose_add_keywords
        - propose_remove_keywords
        - propose_add_negative_keywords
        - propose_remove_negative_keywords
        - propose_add_negatives_to_shared_set
        - propose_attach_shared_set
        - propose_pause_campaign
        - propose_resume_campaign
        - propose_launch_campaign
        - propose_update_campaign
        - propose_remove_campaign
        - propose_set_campaign_network
        - propose_set_campaign_display_network
        - propose_set_campaign_geo_target_type
        - propose_pause_ad_group
        - propose_resume_ad_group
        - propose_remove_ad_group
        - propose_pause_ad
        - propose_resume_ad
        - propose_remove_ad
        - propose_set_geo_proximity
        - propose_set_geo_location
        - propose_attach_audience
        - propose_detach_audience
        - propose_create_rsa
        - propose_create_search_campaign
        - propose_create_gdn_campaign
        - propose_create_demand_gen_campaign
        - propose_create_video_campaign
        - propose_add_sitelinks
        - propose_add_callouts
        - propose_add_structured_snippets
        - propose_add_call_asset
        - propose_add_promotion
        - propose_add_price_asset
        - propose_remove_asset_link
        - propose_composite_change
        - propose_profile_change
        - propose_profile_clear
        - list_pending_proposals
        - cancel_proposal
        # Private control plane: trusted HMAC turn + account scope + atomic transition; no RBAC blocker.
        - list_decisions
        - update_decision
        - list_incidents
        - update_incident
        # Only durable/transport state that Hermes cannot keep in its own dialogue context.
        - start_keyword_research
        - read_keyword_sheet
        - ingest_media
        - start_client_crawl
        - execute_confirmed
  tavily:
    command: npx
    args:
      - -y
      - tavily-mcp
    timeout: 30
    tools:
      include:
        - tavily_search
        - tavily_extract
        - tavily_research
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - file
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - video
    - web
    - yuanbao
  # Typed MCP servers remain available by default. Host/code mutation tools are deliberately CLI-only.
  telegram:
    - clarify
    - cronjob
    - delegation
    - memory
    - session_search
    - skills
    - todo
    - vision
    - web

known_plugin_toolsets:
  cli:
    - spotify
