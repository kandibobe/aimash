# ─────────────────────────────────────────────────────────────────────────────
# Hermes Agent — ЭТАЛОН конфига (ДЕФОЛТНЫЙ профиль).
# ⚠️ ЭТОТ ФАЙЛ — ПРЯМАЯ КОПИЯ ~/.hermes/config.yaml С VPS.
#    Правится ТОЛЬКО через Claude Code → git push → VPS auto-pull.
#    Если меняешь руками на VPS — сделай commit & push, иначе рассинхрон.
# ─────────────────────────────────────────────────────────────────────────────

model:
  provider: openrouter
  default: deepseek/deepseek-v4-pro

agent:
  max_turns: 20
  tool_use_enforcement: auto
  disabled_toolsets:
    - browser
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - file
    - homeassistant
    - memory
    - session_search
    - spotify
    - terminal
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
    - image_gen
    - tts
  reasoning_overrides:
    google/gemini-3.1-flash-lite: none
    deepseek/deepseek-v4-flash: ''
    deepseek/deepseek-v4-pro: high
  reasoning_effort: high

browser:
  cloud_provider: local
  use_gateway: false

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 3
    same_tool_failure: 4
    idempotent_no_progress: 3
  exact_failure: 3
  same_tool_failure: 4
  idempotent_no_progress: 3

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3

openrouter:
  extra_headers: '{"HTTP-Referer": "https://admaster.local", "X-Title": "AdMaster"}'

auxiliary:
  transient_retries: 2
  vision:
    provider: openrouter
    model: google/gemini-3.1-flash-lite
  web_extract:
    provider: openrouter
    model: google/gemini-3.1-flash-lite
  compression:
    provider: openrouter
    model: google/gemini-3.1-flash-lite
  approval:
    provider: openrouter
    model: google/gemini-3.1-flash-lite
  title_generation:
    enabled: true
    provider: openrouter
    model: google/gemini-3.1-flash-lite
  memory_query_rewrite:
    provider: openrouter
    model: google/gemini-3.1-flash-lite
  curator:
    provider: openrouter
    model: google/gemini-3.1-flash-lite

display:
  show_cost: true
  platforms:
    telegram:
      tool_progress: log
  runtime_footer:
    enabled: true
    fields: '["model", "context_pct"]'
  tool_progress: log

dashboard:
  basic_auth:
    username: aimash
    # password_hash/secret — живут в ~/.hermes/.env, сюда не копировать
    # Если меняешь — смержи руками

privacy:
  redact_pii: true

memory:
  memory_enabled: false
  user_profile_enabled: false

delegation:
  model: google/gemini-3.1-flash-lite
  provider: openrouter
  max_iterations: 30
  reasoning_effort: none
  max_concurrent_children: 3
  max_spawn_depth: 1

skills:
  inline_shell: false
  guard_agent_created: true
  write_approval: true

approvals:
  mode: manual
  cron_mode: deny
  deny:
    - rm -rf *
    - sudo *
    - docker *
    - git push*
  destructive_slash_confirm: false

command_allowlist:
  - execute_code
  - overwrite project env/config via redirection
  - recursive delete
  - overwrite project env/config file
  - script execution via -e/-c flag

security:
  redact_secrets: true

gateway:
  platforms:
    telegram:
      allow_from:
        - '787132457'
        - '1674890775'
      group_allow_from:
        - '787132457'
        - '1674890775'
      require_mention: true
      guest_mode: false
      extra:
        group_topics: '[{"chat_id": "-1004443550627", "topics": [{"name": "general",
          "thread_id": 1, "skill": "ad-master-agent"}, {"name": "google-ads", "thread_id":
          153, "skill": "google-ads-worker"}, {"name": "meta-ads", "thread_id": 154,
          "skill": "meta-ads-worker"}, {"name": "tiktok-ads", "thread_id": 155, "skill":
          "tiktok-ads-worker"}, {"name": "approvals-and-audits", "thread_id": 156,
          "skill": "ad-master-agent"}]}]'

onboarding:
  seen:
    busy_input_prompt: true

_config_version: 33

provider_routing:
  require_parameters: true
  data_collection: deny

mcp_servers:
  aimash:
    command: docker
    args:
      - exec
      - -i
      - aimash-bot
      - python
      - -m
      - mcp_server
    timeout: 120
    connect_timeout: 30
    tools:
      include:             # 25 READ (24 Google Ads + recall_client); PLAN/WRITE — только ready-dark
        - list_accounts
        - get_campaign_stats
        - get_adgroup_stats
        - get_keywords
        - get_ads
        - get_search_terms
        - get_negatives
        - get_budgets
        - get_auction_insights
        - get_account_audit
        - get_change_history
        # Р6: журнал правок в САМОМ Google Ads (кто/когда/через какой канал) — не путать с
        # get_change_history, тот про НАШ audit-trail. Google о чужих правках не уведомляет.
        - get_account_changes
        - keyword_ideas
        # Структура и настройки кампаний («было» для правок, не метрики): список кампаний, гео/языки,
        # настройки по имени с группами и RSA, стратегия ставок, разбивки device/network/day,
        # аудитории (доступные и прикреплённые) и остаток нашей суточной квоты операций.
        - list_campaigns
        - read_campaign_targeting
        - read_campaign_config
        - get_bidding_strategy
        - get_report_breakdown
        - list_audiences
        - list_attached_audiences
        - get_quota
        - recall_client
        # §8 MCC: сводка по всем дочерним + глубокий разбор. Список обязан совпадать с
        # READ_TOOL_FUNCS РОВНО (require_registered_surface сверяет на равенство, не на вхождение):
        # добавили инструмент в код и забыли здесь — Hermes его не увидит и работать будет «почти».
        - get_mcc_summary
        - get_mcc_deep
        # Общие списки минус-слов нужны PLAN-обёрткам как READ-контекст; сам инструмент не мутирует.
        - list_negative_shared_sets
  tavily:
    command: npx
    args:
      - -y
      - tavily-mcp
    timeout: 30
    tools:
      include:
        - tavily_search
        - tavily_extract
        - tavily_research
  github:
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-github'
    timeout: 60
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: '${GITHUB_TOKEN}'

platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - file
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - video
    - web
    - yuanbao

known_plugin_toolsets:
  cli:
    - spotify

model_routing:
  gemini:
    provider: openrouter
    model: google/gemini-3.1-flash-lite
  v3:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
  r1:
    provider: openrouter
    model: deepseek/deepseek-v4-pro

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable.
# fallback_model:
