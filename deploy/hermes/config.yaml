# ─────────────────────────────────────────────────────────────────────────────
# Hermes Agent — ЭТАЛОН конфига Контура A (ДЕФОЛТНЫЙ профиль), READ-пилот.
#
# Копируется на VPS в ~/.hermes/config.yaml, плейсхолдеры REPLACE_* заменяются на
# реальные id (см. deploy/hermes/README.md, RB-1 шаг 3 / RB-2). СЕКРЕТОВ ЗДЕСЬ НЕТ:
# токены/ключи — только в ~/.hermes/.env (правило 5), сюда попадают как ${VAR}.
#
# ⚠️ К10 (конфиг-линт): Hermes МОЛЧА игнорирует неизвестные ключи — опечатка = «конфиг
#    рабочий на вид, но не работает». Все ключи ниже сверены с docs v0.17
#    (NousResearch/hermes-agent). ПЕРЕД правкой сверяй каждый ключ с
#    `cli-config.yaml.example` пиновой версии: `hermes config check` + ручная сверка.
#
# Пилот READ-only BY CONSTRUCTION: в MCP-сервере зарегистрированы только 12 READ-
# инструментов, WRITE-инструментов физически нет. Терминал/веб/память у агента выключены.
# ─────────────────────────────────────────────────────────────────────────────

# Дефолтная модель диалога/research (§15, слаг проверен 20.07). Ролевой сплит
# (аудит → gpt-5.6-sol, фон → gemini-3.1-flash-lite, парсинг → luna) — отдельным шагом.
# ⚠️ Форма ОБЯЗАТЕЛЬНО mapping (`provider` + `default`), НЕ скаляр `model: <slug>` — так пишет мастер
#    `hermes model` и так показывают доки v0.17; скаляр по К10 молча игнорится → откат на Nous Portal,
#    ключ OpenRouter не задействуется. base_url/api_mode проставляет мастер — здесь не дублируем.
model:
  provider: openrouter
  default: openai/gpt-5.6-terra

# Рероут OpenRouter на провайдера, который не принимает `tools`, молча срезает tool-calling —
# агент «отвечает текстом» вместо вызова MCP, и выглядит это как деградация модели, не как сбой.
# `require_parameters: true` — предпосылка И8/правила 13 (CLAUDE.md): без него правило проваливается
# ТИХО. Ключи аттестованы (cli-config.yaml.example:163,166 — в примере закомментированы, но реальны).
provider_routing:
  require_parameters: true
  data_collection: "deny"      # данные рекламных аккаунтов клиентов — не обучающая выборка

agent:
  # ЭТАЛОН = ОДОБРЕННЫЙ минимум Контура A: агент только отвечает и зовёт MCP READ-инструменты.
  # Включёнными остаются лишь безопасные тулсеты (skills — привязка топик→скил, todo, clarify)
  # + наш MCP `aimash` (он НЕ в этом списке — приходит из mcp_servers ниже).
  # Гасим ВСЁ host-мощное и внешнее — иначе на боевом VPS (там же денежный бот) агент получил бы
  # терминал/ФС/выполнение кода/управление рабочим столом. Схема «два контура, ноль общих секретов»
  # (Meta Rule of Two): такие возможности живут в Контуре B (билдер-песочница), не в проде.
  # Слаги сверены с docs v0.17 (toolsets-reference) 20.07 — К10.
  # ⚠️ Оператор вправе РАСШИРИТЬ набор на своём инстансе (мастер + approvals: manual) — тогда этот
  #    `agent:`-блок из эталона НЕ мёржить, иначе он снова погасит выбранное. Репо-эталон при этом
  #    остаётся источником истины по одобренной архитектуре.
  # Слаги сверены со списком установленной версии (`platform_toolsets.cli` в живом конфиге,
  # 21.07): browser, clarify, code_execution, context_engine, cronjob, delegation, file,
  # image_gen, memory, session_search, skills, terminal, todo, tts, video, vision, web.
  # `computer_use`/`x_search`/`kanban` из прежней редакции в этом списке ОТСУТСТВУЮТ (К10 —
  # молча игнорируются), зато были пропущены `context_engine` (индексация ФС) и `video`.
  #
  # ⚠️ `session_search` ОТКЛЮЧЁН осознанно (К9/И6, добавлен 21.07). Он ищет по ВСЕЙ
  #    `~/.hermes/state.db`, то есть по истории всех топиков инстанса — а топик у нас = клиент
  #    (`gateway…group_topics` ниже). Оставленный включённым, он даёт агенту кросс-клиентное
  #    чтение переписки в обход нашего замка: `ensure_read_allowed` защищает данные Google Ads,
  #    но не state.db Hermes. Изоляция по client_id (И6) в НАШИХ ридерах — отдельная работа;
  #    пока её нет, единственный контроль над чужим инструментом — не включать его.
  #    Цена: агент не помнит прошлые сессии — по замыслу пилота (memory_enabled: false ниже).
  # ⚠️ ПРЕДЛОЖЕНО 2026-07-23, В ЭТАЛОНЕ НЕ ПРИМЕНЕНО — первый шаг автономии (§5.6 SPEC):
  #    убрать из выключенных `cronjob` и `delegation`. Оба ЕСТЬ в списке установленной версии
  #    (сверка 21.07 выше) и были погашены заодно со всем остальным.
  #    Правка живёт в рабочем дереве до закрытия четырёх предусловий ниже; пока она там,
  #    `lint_config.py` на этом файле КРАСНЫЙ — это и есть её статус, а не сбой линта.
  #    • `cronjob`   → агент сам заводит расписания и сам доставляет результат в топик
  #                    (закрывает R8 встроенно). Работает в паре с `approvals.cron_mode`.
  #    • `delegation`→ субагенты, параллельная проработка задачи.
  #
  #    ⛔ ПРЕЖНЕЕ ОБОСНОВАНИЕ ЗДЕСЬ БЫЛО НЕВЕРНЫМ и снято: «WRITE физически отсутствуют ⇒
  #       автономный прогон не может ничего потратить» подменяет один бюджет другим. Гейт
  #       подтверждения защищает бюджет Google Ads, а не бюджет LLM (SPEC §10.3, :1148).
  #       Google Ads он действительно не тронет — а токены тратит, и потолка ниже агента нет:
  #       `core/usage.py` вызовы Hermes не видит, они идут до нашего процесса.
  #
  #    ЧЕТЫРЕ НЕЗАКРЫТЫХ ПРЕДУСЛОВИЯ (пока хоть одно открыто — правка живёт в рабочем дереве
  #    и `lint_config.py` на этом файле КРАСНЫЙ; это и есть её статус, а не сбой линта):
  #    1. Потолок расхода на LLM не подтверждён. Процедура есть (RB-3: provisioning-ключ
  #       OpenRouter с `limit` + `limit_reset: daily`), но помечена «рекомендация, не блокер»,
  #       числа в ней нет, выполнение на VPS не подтверждено. Ключ — отдельный от ключа
  #       бота (SPEC:1154). Cron даёт свежую сессию на тик, delegation множит на субагентов.
  #    2. Обратимость не проверена живьём. `OPERATIONS.md:325`: возврат `cronjob` в выключенные
  #       НЕ останавливает уже созданные джобы — внутренний тикер исполняет их независимо от
  #       тулсета. Помечено `[Likely]`, а не `[Certain]` ⇒ проверять, а не верить в любую
  #       сторону: завести джоб → погасить тулсет → смотреть таймстемпы `~/.hermes/cron/output/`.
  #    3. `cron_mode: approve` НАШ путь не гейтит. Не «семантика неизвестна» — опровергнуто
  #       первоисточником: «Approval flows do not govern MCP tool invocations» [фетч апстрим
  #       user-guide/security.md 21.07, цитата в host-a/config.yaml:108-110]. Approvals гейтят
  #       ТЕРМИНАЛЬНЫЕ команды, а терминал здесь выключен. Человек утверждает постановку
  #       расписания один раз; все последующие запуски идут без него.
  #    4. `delegation` до И6/И8 нельзя технически, а не по осторожности: субагент наследует MCP
  #       родителя, изоляции по client_id нет, а счётчик «≤1 черновик на ход» (правило 13)
  #       ломается на fan-out — N субагентов дают N черновиков на один человеческий ход.
  #
  #    ⛔ ОТДЕЛЬНО, ПЕРЕД ВЫПУСКОМ WRITE: провенанс И3 обязан отсекать мутации, инициированные
  #       cron'ом и детекторами аномалий (правило 3, §3.9.5 SPEC — `user_initiated=False` по
  #       умолчанию). Иначе cron + WRITE = трата без команды человека.
  #    `kanban` в списке установленной версии ОТСУТСТВУЕТ — вслепую не включаем:
  #       сначала `hermes version` (субкоманда, НЕ `--version`) и живой список тулсетов — это V1.
  disabled_toolsets:
    [terminal, browser, file, code_execution, context_engine, cronjob, delegation,
     web, memory, vision, image_gen, tts, video, session_search]
  tool_use_enforcement: auto

  # Выписаны явно, а не оставлены на дефолт: cron даёт СВЕЖУЮ сессию на каждый тик, и потолка
  # расхода на LLM ниже агента у нас нет (`core/usage.py` вызовы Hermes не видит — они идут до
  # нашего процесса). Гейт подтверждения защищает бюджет Google Ads, а не бюджет LLM (SPEC §10.3).
  max_turns: 60              # сверено (cli-config.yaml.example, дефолт апстрима ровно 60)
  reasoning_effort: medium   # сверено; допустимые: xhigh|high|medium|low|minimal|none

approvals:
  mode: manual
  # deny — fnmatch-глобы КОМАНД (не имена тулсетов!). Defense-in-depth: терминал и так выключен.
  deny: ["rm -rf *", "sudo *", "docker *", "git push*"]
  # Пара к `cronjob` в agent.disabled_toolsets выше. Допустимы deny | approve; `manual`
  # невалидно (К10 съест молча). В эталоне `deny`, потому что тулсет погашен; предложенное
  # `approve` («агент ПРЕДЛАГАЕТ расписание, человек утверждает») идёт вместе с правкой из
  # рабочего дерева и НЕ является гейтом на наш путь — см. предусловие 3 выше.
  cron_mode: deny

tool_loop_guardrails:
  # Против петли «агент чинит собственную ошибку». На READ-пилоте это счёт за токены; с шага 5
  # тот же класс — уже деньги клиента.
  #
  # ⚠️ ИМЕНА — ГОТОВЫЙ К10-КАПКАН, и мы в него уже попадали: очевидные `enabled`/`hard_stop`
  #    НЕ СУЩЕСТВУЮТ, обе строки Hermes съел бы молча. Верные — с суффиксом `_enabled`
  #    [Проверено — фетч cli-config.yaml.example 21.07]. Дефолты апстрима:
  #    warnings_enabled: true, hard_stop_enabled: false.
  warnings_enabled: true
  # Апстрим держит hard-stop выключенным и называет его «opt-in circuit breakers for
  # autonomous/cron sessions». С включённым `cronjob` сессия у нас ровно такая.
  hard_stop_enabled: true
  # Пороги — дефолты апстрима, выписаны явно, чтобы смена дефолта в 0.x была видна диффом (Р7).
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

# Сжатие контекста — единственный потолок РОСТА одного промпта в долгоживущей сессии Telegram
# (топик живёт неделями, история копится). Значения = дефолты апстрима, но ВЫПИСАНЫ ЯВНО
# (Р7: смена дефолта в 0.x видна диффом, а не «стало иначе молча»). Схема сверена с pinned-
# источником построчно (cli-config.yaml.example @ v2026.7.20): enabled:409, threshold:415,
# target_ratio:425, protect_last_n:430, protect_first_n:450 — top-level ключ, НЕ под agent:.
# ⚠️ Это НЕ потолок расхода на LLM: сжатие уменьшает РАЗМЕР одного промпта, а не число вызовов
#    (потолок расхода — незакрытое предусловие 1 в agent:, его у нас пока нет).
# ⚠️ НЕ ВЕРИФИЦИРОВАНО в этом заходе: суммаризацию гонит ВСПОМОГАТЕЛЬНАЯ модель
#    (`auxiliary.compression`, по умолчанию Gemini Flash, автодетект кредов). Она читает
#    обрезаемую историю топика = переписку клиента; распространяется ли на её вызовы
#    `provider_routing.data_collection: deny` — проверить ПЕРЕД тем, как полагаться (Р2/И6).
compression:
  enabled: true          # дефолт апстрима, выписан явно (без него — ошибка на переполнении окна)
  threshold: 0.50        # старт сжатия при 50% окна модели (дефолт)
  target_ratio: 0.20     # хвост-остаток как доля threshold (дефолт)
  protect_last_n: 20     # последние ~10 полных ходов не суммируются (дефолт)
  protect_first_n: 3     # + первые 3 не-system сообщения топика (дефолт)

# ⚠️ ЧАСТИ КЛЮЧЕЙ НИЖЕ НЕТ В `cli-config.yaml.example` — И ЭТО НЕ ЗНАЧИТ, ЧТО ИХ НЕТ.
#    Пример апстрима — НИЖНЯЯ ГРАНИЦА, а не whitelist: `skills.write_approval`,
#    `skills.guard_agent_created`, `skills.inline_shell`, `privacy.redact_pii`,
#    `memory.user_profile_enabled`, `security.*` в нём не встречаются вовсе, хотя все
#    задокументированы и читаются кодом. Вывод «нет в примере ⇒ съест К10» неверен и один раз
#    чуть не стоил нам этих гардов. Сверять по докам + исходнику, не по примеру.
memory:
  memory_enabled: false        # проверенный ключ (НЕ spec-`provider: none`)
  user_profile_enabled: false  # сверено (configuration.md, дефолт апстрима `true`) —
                               # «профиль пользователя» ОДИН на всю команду и всех клиентов,
                               # то есть кросс-клиентная утечка мимо И6 (Р2)

privacy:
  redact_pii: true             # сверено (configuration.md, дефолт `false`, действует ТОЛЬКО
                               # на gateway-пути). Обязателен: агент краулит сайты клиентов

skills:
  write_approval: true    # по умолчанию false — включаем: агент не пишет скилы без ревью
  guard_agent_created: true
  # `inline_shell` выписан ЯВНО, хотя дефолт апстрима и так `false`: К1/правило 14 объявляют его
  # «выключенным навсегда», а дефолт в 0.x — не обещание (Р7). Что он делает: позволяет скилу
  # исполнять shell прямо из своего markdown, то есть даёт тексту, который агент пишет себе сам,
  # прямой путь в терминал боевого VPS в обход `approvals`. Здесь это тяжелее, чем на Хосте A:
  # рядом живёт денежный контейнер бота с OAuth-токенами.
  inline_shell: false

display:
  # САМАЯ ДЕШЁВАЯ НАБЛЮДАЕМОСТЬ В ПРОЕКТЕ — след, независимый от текста агента
  # (К7: Hermes не сверяет финальный текст со статусом tool-вызовов).
  #
  # Значение `log` СВЕРЕНО ПО ИСХОДНИКУ, не по докам: доки (`tool_progress: all # off | new |
  # all | verbose`) режим `log` не упоминают вовсе, а живой нормализатор принимает пять значений
  # (`gateway/display_config.py:256`). Отсюда главный К10-капкан этого блока: любая опечатка в
  # значении не роняет старт и не пишет предупреждений — она молча даёт `all`, то есть след
  # теряется, а чат заполняется пузырями. Ловит только `lint_config.py` и глаза на `config show`.
  #
  # ⚠️ ЧТО ИМЕННО ПИШЕТСЯ (апстрим-тест `tests/gateway/test_tool_log_mode.py`): строка на каждый
  #    `tool.started` в `~/.hermes/logs/tool_calls.log` через `RedactingFormatter`.
  #    ⛔ `tool.completed` НЕ ПИШЕТСЯ. Лог доказывает ФАКТ ВЫЗОВА и аргументы, но НЕ УСПЕХ:
  #      ловит «агент сказал, что сделал, а инструмент не звал», и НЕ ловит «звал, тот упал,
  #      агент отчитался успехом» — вторую половину К7 закрывает наш отчёт из audit-row.
  #    ⛔ В режиме `log` чат МОЛЧИТ: человек в Telegram не видит вызовов. Осознанный размен.
  tool_progress: log
  platforms:
    telegram:
      tool_progress: log   # платформа без override падает на глобальное, но дефолт Telegram — не `log`

security:
  # Регексная редакция ключей/токенов в выводе инструментов И в логах, ДО входа текста в контекст
  # модели [configuration.md: «On by default»]. Выписан явно, чтобы смена дефолта была видна
  # диффом (Р7). ⛔ Границей НЕ является и правило 5 не заменяет: `developer_token` — голая
  # алфавитно-цифровая строка, безопасного регекса под неё нет. Наши три рубежа редакции —
  # `core.logging.redact_text` / `bot.ux.err_text` / docs/SECURITY.md.
  redact_secrets: true

# ── Плагины: в ЭТАЛОНЕ ни один не включён, и это правильное состояние ──────────
# Дефолт апстрима здесь fail-closed сам по себе: «General plugins and user-installed backends
# are disabled by default» [features/plugins.md, тег v2026.7.20]. Плагин — это код, который
# грузится В ПРОЦЕСС gateway, то есть рядом с `OPENROUTER_API_KEY`; включать по одному и с
# обоснованием.
#
# ⛔ СКОПИРОВАТЬ КАТАЛОГ — НЕ ЗНАЧИТ ВКЛЮЧИТЬ. `~/.hermes/plugins/<name>/` без имени в
#    `enabled` обнаружением ВИДИТСЯ (`hermes plugins` покажет), а хуки и инструменты не
#    грузятся. Для диагностического прогона это ловушка ценой всего замера: лог остаётся
#    пустым, и пустота читается как «метаданные до хука не доходят» — ложный отрицательный
#    вывод ровно по вопросу, ради которого прогон затевается (лестница чтения — OPERATIONS.md §12).
#
# ⚠️ Хуки фейлятся OPEN («errors in any hook are caught and logged, never crashing the agent»),
#    поэтому плагин может быть только ПОСТАВЩИКОМ метаданных. Решение отказать выносит наш слой:
#    `execute_confirmed` обязан отказать при отсутствии доверенной записи, а не полагаться на то,
#    что хук отработал (правило 10, CLAUDE.md).
#
# ВРЕМЕННО, только на прогон V1–V22 (OPERATIONS.md §12, блоки B–C), снимается в V18:
# plugins:
#   enabled:
#     - aimash_probe

mcp_servers:
  aimash:
    # Окружение берём из уже работающего контейнера бота: docker exec наследует env
    # (DATABASE_URL=@postgres:5432, GOOGLE_ADS_*, SECRETS_ENCRYPTION_KEY, ENV), deps и
    # OAuth-кэш в БД. Паритет окружения без host-venv. Durable-вариант (compose-сервис
    # `mcp`) — см. README, раздел «MCP-интеграция».
    command: docker
    args: ["exec", "-i", "aimash-bot", "python", "-m", "mcp_server"]
    timeout: 120           # bootstrap (init_db + обход MCC) занимает секунды
    connect_timeout: 30
    tools:
      include:             # ровно 12 READ; PLAN/WRITE добавляются шагом перед автономией
        - list_accounts
        - get_campaign_stats
        - get_adgroup_stats
        - get_keywords
        - get_ads
        - get_search_terms
        - get_negatives
        - get_budgets
        - get_auction_insights
        - get_account_audit
        - get_change_history
        - keyword_ideas

gateway:
  platforms:
    telegram:
      # Три ОРТОГОНАЛЬНЫХ гейта [дословно из апстрим-доков messaging/telegram.md]:
      #   allow_from          — «Global access (DMs + groups). Users here can always invoke the bot»
      #   group_allow_from    — «Sender IDs allowed in groups/forums only. Does NOT grant DM access»
      #   group_allowed_chats — «Entire groups/forums — **any member is authorized**»
      #
      # ⛔ ДВА ФАКТА, СВЕРЕННЫЕ ПО ИСХОДНИКУ АПСТРИМА (не по докам), 21.07. Полный разбор со
      #    ссылками на строки — в deploy/hermes/host-a/config.yaml, блок `gateway:`; коротко:
      #    1) гейты доступа читаются С УРОВНЯ БЛОКА, а не из `extra:` (adapter.py:9391/9396/9401
      #       → env, и только env смотрит gateway/authz_mixin.py::_is_user_authorized).
      #       В `extra:` (как в апстрим-доках и в прошлой редакции этого файла) `group_allow_from`
      #       не читает никто — К10 в чистом виде;
      #    2) `group_allowed_chats` авторизует чат ЦЕЛИКОМ и делает это ПЕРВЫМ, до проверки лица
      #       (authz_mixin.py:344-358), то есть отменяет `group_allow_from`, а не дополняет его.
      #    Поэтому чат-лист снят, а К4 (HERMES_SPEC.md:315) выполняется перечислением людей.
      allow_from: ["787132457", "1674890775"]        # ваш user id (@userinfobot) → TELEGRAM_ALLOWED_USERS
      group_allow_from: ["787132457", "1674890775"]  # КТО командует в группе (fail-closed, К4)
      # group_allowed_chats: ["-1004443550627"]   # НЕ включать: см. п.2 выше
      require_mention: true                  # в группе бот отвечает только на упоминание
      guest_mode: false
      extra:
        # `group_topics` — наоборот, только в `extra`: единственный потребитель читает
        # `self.config.extra.get("group_topics", [])` (adapter.py:9023).
        group_topics:                                # привязка форум-топик → скил (как на скриншоте)
          - chat_id: "-1004443550627"
            topics:
              - { name: "Настройка рекламы", thread_id: 0, skill: paid-growth }
              - { name: "Оптимизация ТикТок", thread_id: 0, skill: wash24-miyki24-agent }
              # thread_id узнать из URL топика в Telegram Web: t.me/c/<id>/<thread_id>

# ── Опционально (НЕ включать без сверки ключей с cli-config.yaml.example — К10) ──
# Фоновые расходы Hermes на дешёвую модель. Ключи `auxiliary.*` по живым докам не
# верифицированы в этом заходе — раскомментировать только после `hermes config check` и
# ручной сверки, иначе молча игнорируется.
# auxiliary:
#   compression:
#     model: google/gemini-3.1-flash-lite
