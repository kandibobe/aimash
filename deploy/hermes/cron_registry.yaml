version: 1
last_verified_at: '2026-07-30T14:41:00Z'
owner: kandibobe
purpose: Canonical registry of AdMaster cron jobs with criticality, expected state, and alert semantics.

default_rules:
  paused_P0: immediate_alert
  failed_P0: immediate_alert
  paused_P1: daily_digest
  failed_P1: daily_digest
  failed_P2: tolerate_1_to_2_runs_then_digest

jobs:
  - job_id: '478eac21bfe6'
    name: '🚨 Hourly Watchdog — Fire Detector'
    criticality: P0
    purpose: Detect spend/conversion/account anomalies during operator hours.
    provider: openai-codex
    model: gpt-5.4
    expected_state: scheduled
    actual_state: paused
    enabled_expected: true
    alert_if_paused: true
    silent_on_normal: false
    note: Highest-priority monitoring lane. Current paused state is a live operational risk.

  - job_id: '6e96062d99ad'
    name: '☀️ Morning Standup (09:00 JST) — Trigger Style'
