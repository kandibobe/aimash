version: 3
last_verified_at: '2026-08-03T10:00:00Z'
owner: kandibobe
purpose: Canonical registry of AdMaster cron jobs with criticality, expected state, and alert semantics.

default_rules:
  execution_policy: read_only_notify_then_wait
  mutations_from_cron: forbidden
  proposals_from_cron: forbidden
  memory_writes_from_cron: forbidden
  artifacts_from_cron: human_command_required
  paused_P0: immediate_alert
  failed_P0: immediate_alert
  paused_P1: daily_digest
  failed_P1: daily_digest
  failed_P2: tolerate_1_to_2_runs_then_digest

jobs:
  - job_id: '478eac21bfe6'
    name: '🚨 Hourly Watchdog — Health Alerts (UTC)'
    criticality: P0
    purpose: Detect spend/conversion/account anomalies during operator hours.
    provider: openai-codex
    model: gpt-5.4-mini
    reasoning_effort: low
    expected_state: scheduled
    actual_state: scheduled
    schedule: '0 9-17 * * *'
    prompt_file: cron_prompts/hourly_watchdog.txt
    auto_resume: true
    enabled_expected: true
    alert_if_paused: true
    silent_on_normal: false
    note: Read-only alerting lane; never applies recommendations or creates proposals autonomously.

  - job_id: '6e96062d99ad'
    name: '☀️ Daily Account Health (09:00 UTC)'
    criticality: P1
    purpose: Daily multi-account operator digest.
    provider: openai-codex
    model: gpt-5.4
    reasoning_effort: medium
    expected_state: scheduled
    actual_state: scheduled
    schedule: '0 9 * * *'
    prompt_file: cron_prompts/daily_health.txt
    enabled_expected: true
    silent_on_normal: false

  - job_id: '031080f7bfac'
    name: '📊 Shadow Mode Daily (18:30 UTC)'
    criticality: P1
    purpose: Evaluate recommendation quality in dry-run/shadow mode.
    provider: openai-codex
    model: gpt-5.6-terra
    reasoning_effort: medium
    expected_state: scheduled
    actual_state: scheduled
    schedule: '30 18 * * *'
    prompt_file: cron_prompts/shadow_daily.txt
    depends_on:
      - '6e96062d99ad'
      - '5db43f3b3d5d'
      - 'b44861829e51'
      - 'a0cff93f3a2b'
    enabled_expected: true
    silent_on_normal: false

  - job_id: 'a0cff93f3a2b'
    name: '🧠 Context Summarization (18:10 UTC)'
    criticality: P2
    purpose: Context compression / memory fallback maintenance.
    provider: openai-codex
    model: gpt-5.4-mini
    reasoning_effort: low
    expected_state: scheduled
    actual_state: scheduled
    schedule: '10 18 * * *'
    prompt_file: cron_prompts/context_summary.txt
    depends_on:
      - '5db43f3b3d5d'
      - 'b44861829e51'
    enabled_expected: true
    silent_on_normal: false

  - job_id: '82097402013a'
    name: 'Session Completion Notifier'
    criticality: P2
    purpose: Notify about completed Hermes sessions.
    provider: openai-codex
    model: gpt-5.4-mini
    reasoning_effort: low
    expected_state: scheduled
    actual_state: scheduled
    enabled_expected: true
    silent_on_normal: true

  - job_id: 'e4f1b2ae179d'
    name: '🧹 Weekly Account Review (Friday 10:00 UTC)'
    criticality: P1
    purpose: Full weekly WoW account audit and prioritized advisory review.
    provider: openai-codex
    model: gpt-5.6-sol
    reasoning_effort: high
    expected_state: scheduled
    actual_state: scheduled
    schedule: '0 10 * * 5'
    prompt_file: cron_prompts/weekly_review.txt
    enabled_expected: true
    silent_on_normal: false

  - job_id: '2a402a32e5ec'
    name: '📝 Monthly Strategic Audit (day 1, 11:00 UTC)'
    criticality: P2
    purpose: Full monthly strategic account audit and client-report review.
    provider: openai-codex
    model: gpt-5.6-sol
    reasoning_effort: high
    expected_state: scheduled
    actual_state: scheduled
    schedule: '0 11 1 * *'
    prompt_file: cron_prompts/monthly_review.txt
    enabled_expected: true
    silent_on_normal: false

  - job_id: 'b44861829e51'
    name: '🌙 Drift Detection (17:50 UTC)'
    criticality: P1
    purpose: Detect operational/config/account drift.
    provider: openai-codex
    model: gpt-5.4
    reasoning_effort: medium
    expected_state: scheduled
    actual_state: scheduled
    schedule: '50 17 * * *'
    prompt_file: cron_prompts/drift_detection.txt
    enabled_expected: true
    silent_on_normal: false

  - job_id: '5db43f3b3d5d'
    name: '💰 Daily Budget Check (17:30 UTC)'
    criticality: P0
    purpose: Detect end-of-day budget cap violations / spend safety issues.
    provider: openai-codex
    model: gpt-5.4
    reasoning_effort: medium
    expected_state: scheduled
    actual_state: scheduled
    schedule: '30 17 * * *'
    prompt_file: cron_prompts/daily_budget.txt
    enabled_expected: true
    alert_if_paused: true
    silent_on_normal: false

  - job_id: 'c15dd12e50a6'
    name: '🔄 Git Auto-Sync (каждый час)'
    criticality: P2
    purpose: Repository housekeeping sync.
    provider: openai-codex
    model: gpt-5.4-mini
    reasoning_effort: low
    expected_state: scheduled
    actual_state: scheduled
    enabled_expected: true
    silent_on_normal: true
