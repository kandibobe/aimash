version: 2
last_verified_at: '2026-08-01T00:00:00Z'
owner: kandibobe
purpose: Canonical runtime registry for AdMaster/Hermes. This file is the single source of truth for present-tense runtime/model/provider policy. Any conflicting docs/skills must either reference this file or explicitly mark themselves as historical or pinned exceptions.

primary_runtime:
  provider: openai-codex
  model: gpt-5.6-sol
  status: canonical_current
  applies_to:
    - interactive_chat
    - default_analysis
  notes:
    - Repository truth is deploy/hermes/config.yaml; live truth still requires `hermes model` after deploy.
    - Automatic semantic model_routing is not supported by the pinned Hermes runtime.
    - Live VPS was measured before this apply on 2026-08-01 as openai-codex/gpt-5.6-terra; changing this registry alone does not restart or mutate the gateway.

pinned_exceptions:
  - scope: cron_legacy_jobs
    provider: openai-codex
    model: gpt-5.4
    status: pinned_exception
    source_of_truth: /root/.hermes/cron/jobs.json
    notes:
      - Live cron jobs are still pinned to gpt-5.4 at time of verification.
      - This is an operational exception, not the canonical present-tense runtime for chat.
routing_lanes:
  dialogue_and_analysis:
    provider: openai-codex
    model: gpt-5.6-sol
    status: canonical_current
  primary_fallback:
    status: disabled_by_policy
    notes:
      - Do not send Google Ads or client context to an external fallback provider.
  lightweight_background:
    provider: openai-codex
    model: gpt-5.4
    status: canonical_auxiliary
  delegated_subagents:
    provider: openai-codex
    model: gpt-5.6-sol
    status: canonical_current
  deep_audit_strategy:
    provider: openai-codex
    model: gpt-5.6-sol
    status: explicit_workflow_only
  external_coding_executor:
    provider: external
    model: codex-cli
    status: only_when_explicitly_needed

policy_rules:
  - Docs and skills must not state a present-tense runtime different from primary_runtime unless labelled as pinned_exception or historical_context.
  - Cron jobs may pin older models temporarily, but must be listed under pinned_exceptions or cron_registry.yaml.
  - "Dashboard model selections are not a policy source: sync_aimash_surface.py pins main, delegation, auxiliary and fallback settings on deploy."
  - Memory should store only high-level routing facts, not full policy prose.

known_conflicts:
  - file: /root/.hermes/config.yaml
    lines: model, agent, delegation, platform_toolsets.telegram
    issue: Live gateway used Terra with oversized turn limits and exposed host/code toolsets to Telegram at the 2026-08-01 pre-apply measurement.
  - file: /root/.hermes/cron/jobs.json
    lines: '11-12, 60-61, 102-103, 142-143, 190-191'
    issue: Live cron jobs still pinned to gpt-5.4.
  - file: /root/.hermes/skills/ad-master/ad-master-agent/SKILL.md
    lines: '11-12'
    issue: Live stale skill states gpt-5.4 in present tense; surface sync will replace it with the repository skill.
  - file: /root/.hermes/skills/ad-master/aimash-development/SKILL.md
    lines: '149-157'
    issue: Skill cron matrix still states gpt-5.4 as current.
