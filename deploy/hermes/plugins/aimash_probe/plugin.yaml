# Манифест ВРЕМЕННОГО диагностического плагина `aimash_probe` (прогон V1–V22, §12 OPERATIONS.md).
#
# СХЕМА ПОДТВЕРЖДЕНА первоисточником на пиновом теге `v2026.7.20` (= релиз v0.19.0):
# `website/docs/user-guide/features/plugins.md` — минимальный манифест это ровно три поля
# (`name`, `version`, `description`), код лежит в `__init__.py`, подписка на хуки идёт
# ТОЛЬКО из `def register(ctx)` через `ctx.register_hook(...)`.
#
# ⛔ ПОЛЯ `hooks:` В СХЕМЕ НЕТ. Прежняя редакция этого файла маршрутизировала хуки строками
#    `pre_gateway_dispatch: hook.py:pre_gateway_dispatch` — по К10 (молчаливое игнорирование
#    неизвестных ключей) плагин загрузился бы и не подписался бы НИ НА ЧТО. Лог остался бы
#    пустым, и пустота была бы прочитана как «метаданные не доходят» — ложный отрицательный
#    вывод ровно по тому вопросу, ради которого весь прогон затевается.
#
# ⛔ КАТАЛОГА НЕДОСТАТОЧНО. Плагин обязан быть перечислен в `plugins.enabled` конфига:
#    «General plugins and user-installed backends are disabled by default»; обнаружение его
#    ВИДИТ (появится в `hermes plugins`), но хуки и инструменты не грузятся. Это причина
#    «пустого лога» номер один — см. лестницу чтения результатов в §12 ранбука.
#
# ⚠️ Плагин ставится на ЖИВОЙ gateway. Только на READ-only пилоте (мутаций в MCP нет by
#    construction), снимать сразу после прогона (V18): `rm -rf ~/.hermes/plugins/aimash_probe`,
#    убрать имя из `plugins.enabled`, перезапуск.

name: aimash_probe
version: "0.1.0"
description: Временный диагностический хук — замер доверенного канала метаданных (V1–V22).

# Декларативная метаданная для витрины и валидации; фактическую подписку она НЕ выполняет
# (её делает `register(ctx)`). Перечислены только те, ради которых плагин существует —
# полный список из 20 имён живёт в `__init__.py:_HOOKS`.
provides_hooks:
  - pre_gateway_dispatch
  - pre_tool_call
