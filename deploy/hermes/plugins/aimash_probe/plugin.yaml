# Манифест ВРЕМЕННОГО диагностического плагина `aimash_probe` (прогон V1–V19, §12 OPERATIONS.md).
#
# ⚠️ [Непроверено] СХЕМА ЭТОГО ФАЙЛА. Форма манифеста плагинов Hermes v0.17 по докам проекта не
#    зафиксирована — подтверждены только ИМЕНА хуков (`pre_gateway_dispatch`, `pre_tool_call`,
#    `HERMES_SPEC.md:1234`). Шаг **V4** чеклиста — первым делом выписать фактическую схему из
#    `hermes plugin --help` / доков установленной версии и привести этот файл к ней.
#    По К10 Hermes МОЛЧА игнорирует неизвестные ключи: неверный манифест = «плагин на месте, но не
#    работает», и это неотличимо от «метаданные не доходят» — то есть ложный вывод ровно по тому
#    вопросу, ради которого всё затевается. Отсюда маркер `plugin_loaded` первой строкой в
#    `~/.hermes/aimash_probe.log` (hook.py): пустой лог = плагин НЕ загрузился, а не «нет данных».
#
# ⚠️ Плагин ставится на ЖИВОЙ gateway. Ставить только на READ-only пилоте (мутаций в MCP нет by
#    construction), снимать сразу после прогона: `rm -rf ~/.hermes/plugins/aimash_probe` + перезапуск.

name: aimash_probe
version: 0.1.0
description: Временный диагностический хук — замер доверенного канала метаданных (V1–V19).

hooks:
  pre_gateway_dispatch: hook.py:pre_gateway_dispatch
  pre_tool_call: hook.py:pre_tool_call
