# ─────────────────────────────────────────────────────────────────────────────
# Hermes Agent — ХОСТ A: «агент, которому дали волю». ОТДЕЛЬНАЯ ВМ.
#
# ⛳ КУДА КОПИРОВАТЬ: `~/.hermes/config.yaml` НОВОЙ ВМ, на которой НЕТ ни docker, ни контейнера
#    `aimash-bot`, ни полноправного `google-ads.yaml`. Если на машине есть хоть одно из трёх —
#    вы копируете не туда, и `terminal: local` ниже отдаёт агенту мутационные креды.
#
# ⚠️ «ХОСТ A» ≠ «КОНТУР A». В этом репозитории «Контур A» — это РОЛЬ процесса (оператор/прод,
#    `HERMES_SPEC.md:128`, `mcp_server/__init__.py:1`), и живёт она как раз на боевом VPS.
#    «Хост A/B» здесь — про ФИЗИЧЕСКИЕ машины новой двуххостовой схемы, и буква совпала
#    неудачно: Хост A — это вольная ВМ, Хост B — тот самый боевой VPS. Ориентируйтесь на строку
#    «КУДА КОПИРОВАТЬ», а не на букву.
#
# ⚠️ ЭТОТ ФАЙЛ — НЕ ГРАНИЦА БЕЗОПАСНОСТИ. Прочитайте это до того, как на него положиться.
#    Здесь включён `terminal`. Агент с терминалом может: переписать этот файл, запустить
#    `hermes --yolo`, импортировать google-ads SDK напрямую в обход MCP, снять `validate_only`.
#    Всё, что ниже, — ЭРГОНОМИКА И НАБЛЮДАЕМОСТЬ: делает нормальное поведение дешёвым, а
#    ненормальное — заметным. Ущерб ограничен ровно одним: **у кредов на этом хосте нет права
#    менять рекламу**. Отказ выносит сервер Google (`authorization_error.ACTION_NOT_PERMITTED`),
#    а не строчка в этом YAML. Проверять — `scripts/verify_readonly_ceiling.py`, регулярно.
#
# Отличие от `deploy/hermes/config.yaml` (эталон READ-пилота на боевом VPS): там терминал/ФС/веб
# выключены, потому что рядом крутится денежный контур и полноправные креды. Здесь наоборот —
# воля полная, а полноправных кредов на хосте физически нет. Два файла НЕ мёржить между собой.
#
# ⚠️ К10: Hermes МОЛЧА игнорирует неизвестные ключи — опечатка даёт конфиг, который выглядит
#    рабочим и не работает. Ниже помечено, что сверено с живой установкой, а что нет.
#
#    СВЕРЕНО со списком установленной версии (`platform_toolsets.cli`, 21.07 — 17 слагов):
#      browser, clarify, code_execution, context_engine, cronjob, delegation, file, image_gen,
#      memory, session_search, skills, terminal, todo, tts, video, vision, web
#    Плюс ключи, уже работающие в репо-эталоне: `model` (форма mapping), `agent.disabled_toolsets`,
#    `agent.tool_use_enforcement`, `approvals.{mode,deny,cron_mode}`, `memory.memory_enabled`,
#    `skills.{write_approval,guard_agent_created}`, `mcp_servers.*`, `gateway.platforms.*`.
#    ⚠️ У `gateway.platforms.telegram` УРОВЕНЬ ВЛОЖЕННОСТИ — часть контракта, а не стиль: гейты
#       доступа читаются с уровня блока, `group_topics` — только из `extra`. Разбор — в блоке.
#
#    ДОСВЕРЕНО 21.07 ПЕРВИЧНЫМ ИСТОЧНИКОМ (фетч апстрима; раньше здесь стоял список «не сверено» —
#    доки отдавали 429). Подтверждены дословно и потому больше не помечаются построчно:
#      `provider_routing.{require_parameters,data_collection}`, `agent.{max_turns,reasoning_effort}`,
#      `approvals.{timeout,cron_mode,mcp_reload_confirm,destructive_slash_confirm}`,
#      `terminal.{backend,cwd,timeout,lifetime_seconds}`, `memory.user_profile_enabled`,
#      `privacy.redact_pii`, `display.tool_progress` + форма `display.platforms.<name>.*`.
#    Источники: user-guide/configuration.md, user-guide/security.md,
#    user-guide/messaging/telegram.md, cli-config.yaml.example.
#
#    ⚠️ И СВЕРКА СРАЗУ ОКУПИЛАСЬ: `tool_loop_guardrails` был написан с НЕСУЩЕСТВУЮЩИМИ именами
#    (`enabled`/`hard_stop` вместо `warnings_enabled`/`hard_stop_enabled`) — обе строки Hermes
#    съел бы молча, и это ровно тот К10, о котором предупреждает эта же шапка. Исправлено.
#    Мораль в силе: сверять ключ первичным источником ДО того, как на него положились.
#
#    ОСТАЁТСЯ НЕ СВЕРЕННЫМ: соответствие апстрим-доков (ветка main) ПИНОВОЙ версии на хосте —
#    у Hermes 0.x ключи между релизами переименовываются (Р7). Поэтому шаг 7 RUNBOOK.md
#    (`hermes config check` + глазами `config show`) остаётся обязательным, а не отменяется.
#    Больнее всего молчаливая потеря `display.tool_progress: log` — это единственный след,
#    независимый от текста агента (К7, upstream #54722): «Silent in chat; append every tool call
#    to ~/.hermes/logs/tool_calls.log (gateway only)». Условие приёмки, а не пожелание.
#
# Секретов здесь нет (правило 5): токены только в `~/.hermes/.env`, сюда приходят как ${VAR}.
# ─────────────────────────────────────────────────────────────────────────────

# Форма ОБЯЗАТЕЛЬНО mapping (`provider` + `default`), НЕ скаляр `model: <slug>`: скаляр по К10
# молча игнорится → откат на Nous Portal, ключ OpenRouter не задействуется.
model:
  provider: openrouter
  default: openai/gpt-5.6-terra

# Фолбэк модели, а не границы безопасности: оба маршрута остаются внутри OpenRouter.
fallback_providers:
  - provider: openrouter
    model: deepseek/deepseek-v4-pro
  - provider: openrouter
    model: google/gemini-3.1-flash-lite

# Рероут OpenRouter на провайдера, который не принимает `tools`, молча срезает tool-calling —
# агент «отвечает текстом» вместо вызова MCP, и выглядит это как деградация модели, не как сбой.
provider_routing:
  require_parameters: true
  data_collection: "deny"      # данные рекламных аккаунтов клиентов — не обучающая выборка

agent:
  # ВКЛЮЧЕНО (то, чего нет в disabled): terminal, file, skills, web, vision, todo, clarify.
  # Это ровно та воля, которую просит заказчик: агент пишет себе скрипты и сам решает, чем ходить.
  #
  # ВЫКЛЮЧЕНО и почему — каждый пункт снимает конкретный сценарий, а не «на всякий случай»:
  #   browser         — главный канал prompt-инъекции (страница диктует агенту команды).
  #                     ⚠️ Если заказчик потребует его включить — это письменное решение (Р2),
  #                     потому что вместе с `terminal` он замыкает цепочку «чужой текст → код».
  #   code_execution  — дублирует terminal, но в песочнице провайдера: второй непросматриваемый путь.
  #   context_engine  — индексация ФС: втягивает в контекст всё, до чего дотянется, включая .env.
  #   cronjob         — агент заводит себе расписание сам ⇒ прямое столкновение с правилом 3
  #                     (бюджет/ставка только по команде человека) и работа без свидетеля.
  #   delegation      — субагент наследует MCP родителя и НИКОГДА не спрашивает человека
  #                     (`subagent_auto_approve: false` = авто-отказ, `true` = авто-апрув).
  #   memory          — `MEMORY.md`/`USER.md` — ОДИН комплект на инстанс, а топик у нас = клиент.
  #   session_search  — FTS5 по всей `state.db`, то есть по переписке всех клиентов сразу.
  #   image_gen/tts/video — не нужны задаче; каждый включённый тулсет это расход и поверхность.
  disabled_toolsets:
    [browser, code_execution, context_engine, cronjob, delegation, image_gen, memory,
     session_search, tts, video]

  # `auto`, а не `true`: истина о том, что произошло, всё равно берётся из audit-row и
  # tool_calls.log (D6), а жёсткий режим ломает нормальные текстовые ответы.
  tool_use_enforcement: auto

  max_turns: 60          # сверено (cli-config.yaml.example, дефолт апстрима ровно 60).
                         # На read-only контуре это счёт за токены, не риск
  reasoning_effort: medium   # сверено; допустимые: xhigh|high|medium|low|minimal|none

approvals:
  # ⚠️ ЧЕСТНО: на этом хосте `approvals` почти декоративны. Спрашивают они только на КАТАЛОГЕ
  #    опасных паттернов, а `python my_analysis.py` в каталог не входит и выполнится молча.
  #    Держим ради шума в логе и мелкой защиты от случайностей, НЕ ради границы.
  #
  # ⚠️ И ещё уже: approvals гейтят ИСКЛЮЧИТЕЛЬНО терминальные команды — «Approval flows do not
  #    govern MCP tool invocations» [Проверено — фетч апстрим user-guide/security.md 21.07].
  #    То есть на путь к Google Ads (он идёт через MCP) они не влияют вообще ни в какой мере.
  mode: manual
  # ⚠️ ЕДИНСТВЕННОЕ ИСКЛЮЧЕНИЕ из «всё здесь декоративно»: `deny` — не совет, а безусловный отказ,
  #    и он срабатывает РАНЬШЕ аварийных выключателей: дословно «block matching terminal commands
  #    unconditionally — **before** `--yolo`, `/yolo`, and `approvals.mode: off`»
  #    [Проверено — фетч security.md 21.07]. Значит агент, запустивший `hermes --yolo`, эти
  #    глобы всё равно не обойдёт — это самая прочная строка во всём файле, хоть и не граница:
  #    fnmatch по тексту команды, путей не резолвит (`bash -c "rm -rf /"` мимо `rm -rf *` пройдёт).
  deny: ["rm -rf *", "sudo *", "docker *", "git push*", "* ~/.hermes/config.yaml", "chattr *"]
  cron_mode: deny                  # допустимы deny | approve; `manual` невалидно — К10 съест
  timeout: 300                     # молчание = ОТКАЗ по умолчанию (сверено, security.md)
  mcp_reload_confirm: true         # /reload-mcp пересобирает набор MCP-инструментов — наш
                                   # единственный канал к Google Ads; подмена = подмена источника
  destructive_slash_confirm: true  # /clear, /new, /reset, /undo — до потери состояния сессии

terminal:
  # Ключи сверены (cli-config.yaml.example, все четыре ACTIVE). Это удобство и гигиена, не изоляция.
  backend: local                 # НЕ контейнерный: при docker/modal/daytona guard stack
                                   # пропускается целиком («container bypass»), и даже
                                   # декоративные апрувы перестают срабатывать
  cwd: /opt/hermes/work            # рабочий каталог агента, отдельно от ~/.hermes
  timeout: 180
  lifetime_seconds: 300

tool_loop_guardrails:
  # Против петли «агент чинит собственную ошибку» — на read-only это про деньги за токены, но на
  # этапе 2 тот же класс уже про деньги клиента.
  #
  # ⚠️ ИМЕНА ЗДЕСЬ — ГОТОВЫЙ К10-КАПКАН, и мы в него уже попадали: очевидные `enabled`/`hard_stop`
  #    НЕ СУЩЕСТВУЮТ, обе строки Hermes съел бы молча, и guardrails остались бы дефолтными.
  #    Верные имена — с суффиксом `_enabled` [Проверено — фетч cli-config.yaml.example 21.07,
  #    блок дословный]. Дефолты апстрима: warnings_enabled: true, hard_stop_enabled: false.
  warnings_enabled: true
  # Апстрим держит hard-stop выключенным и называет его «opt-in circuit breakers for
  # autonomous/cron sessions». У нас сессия ровно такая (агент работает сам), поэтому включаем:
  # упереться в потолок итераций дороже, чем остановиться.
  hard_stop_enabled: true
  # Пороги — дефолтные значения апстрима, выписаны явно, чтобы смена дефолта в 0.x была видна
  # диффом, а не «однажды стало по-другому» (Р7).
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

# ⚠️ ЧЕТЫРЕ БЛОКА НИЖЕ ОТСУТСТВУЮТ В `cli-config.yaml.example` — И ЭТО НЕ ЗНАЧИТ, ЧТО ИХ НЕТ.
#    Пример конфига апстрима — НИЖНЯЯ ГРАНИЦА, а не whitelist ключей: `skills.write_approval`,
#    `skills.guard_agent_created`, `skills.inline_shell`, `privacy.redact_pii`,
#    `memory.user_profile_enabled`, `security.*` в нём не встречаются вовсе, хотя все
#    задокументированы и читаются кодом. Вывод «ключа нет в примере ⇒ ключ съест К10» неверен и
#    один раз чуть не стоил нам этих гардов. Сверять — по докам + исходнику, не по примеру.
memory:
  memory_enabled: false        # один комплект на инстанс ⇒ кросс-клиентная утечка (Р2)
  user_profile_enabled: false  # сверено (configuration.md, дефолт апстрима `true`) —
                               # «профиль пользователя» один на всю команду и всех клиентов

privacy:
  redact_pii: true             # сверено (configuration.md, дефолт `false`, действует ТОЛЬКО
                               # на gateway-пути). Обязателен, если агент краулит сайты клиентов

skills:
  write_approval: true         # сверено (configuration.md). Дефолт `false` = агент правит свои
                               # ПОСТОЯННЫЕ инструкции без ревью. Включённым — записи копятся в
                               # ~/.hermes/pending/skills/ и разбираются `/skills pending`
  guard_agent_created: true    # сверено (configuration.md, дефолт `false`)
  # `inline_shell` выписан ЯВНО, хотя дефолт апстрима и так `false`: К1 объявляет его «навсегда
  # выключенным», а дефолт в 0.x — не обещание (Р7). Что он делает: позволяет скилу исполнять
  # shell-команды прямо из своего markdown, то есть даёт тексту, который агент пишет себе сам,
  # прямой путь в терминал в обход `approvals`.
  inline_shell: false

display:
  # САМАЯ ДЕШЁВАЯ НАБЛЮДАЕМОСТЬ В ПРОЕКТЕ — след, независимый от текста агента
  # (К7: Hermes не сверяет финальный текст со статусом tool-вызовов).
  #
  # Значение `log` СВЕРЕНО ПО ИСХОДНИКУ, а не по докам, и это важно: доки
  # (configuration.md, строка `tool_progress: all # off | new | all | verbose`) режим `log`
  # НЕ УПОМИНАЮТ ВОВСЕ. Живой нормализатор принимает пять значений —
  # `gateway/display_config.py:256`: `return val if val in {"off","new","all","verbose","log"}
  # else "all"`. Отсюда же главный К10-капкан этого файла: ЛЮБАЯ опечатка в значении не роняет
  # старт и не пишет предупреждения — она молча даёт `all`, то есть след теряется, а чат
  # заполняется пузырями. Проверять только глазами по `hermes config show` (шаг 7 ранбука).
  #
  # ⚠️ ЧТО ИМЕННО ПИШЕТСЯ — сверено по апстрим-тесту `tests/gateway/test_tool_log_mode.py`:
  #    • строка на КАЖДЫЙ `tool.started`: «<время>  <инструмент>: "<превью аргументов>"»;
  #    • файл `~/.hermes/logs/tool_calls.log`, RotatingFileHandler 5 MB × 3 бэкапа,
  #      формат прогоняется через `agent.redact.RedactingFormatter`;
  #    • `_thinking` не пишется.
  #    ⛔ `tool.completed` НЕ ПИШЕТСЯ (`test_tool_completed_not_enqueued`). Значит лог доказывает
  #      ФАКТ ВЫЗОВА и его аргументы, но НЕ УСПЕХ. Он ловит «агент сказал, что сделал, а
  #      инструмент не звал» — и НЕ ловит «инструмент звал, тот упал, агент отчитался успехом»,
  #      то есть ровно вторую половину К7. Поэтому «выполнено» на этапе 2 репортит НАШ код из
  #      audit-row (неснимаемый минимум 9), а не этот лог и не текст агента.
  #    ⛔ В режиме `log` чат МОЛЧИТ (`test_log_mode_disables_chat_progress`) — человек в Telegram
  #      не видит ни одного вызова. Это осознанный размен: наблюдаемость уезжает в файл на хосте.
  tool_progress: log
  platforms:
    # Ключ `telegram` допустим (configuration.md, список платформ). Дублируем глобальное значение
    # явно: платформа без override падает на глобальное, но дефолт для Telegram — не `log`.
    telegram:
      tool_progress: log

mcp_servers:
  aimash-read:
    # На Хосте A нет ни контейнера бота, ни его окружения ⇒ вариант `docker exec` из репо-эталона
    # здесь неприменим. Запуск через обёртку, которая делает cd + PYTHONPATH + подхват .env:
    # без неё `core/config.py` читает .env из ТЕКУЩЕГО каталога и стартует с чужими настройками.
    # Установка и текст обёртки — RUNBOOK.md, шаг 5.
    command: /opt/aimash-read/bin/mcp-read
    args: []
    timeout: 120
    connect_timeout: 30
    tools:
      include:
        # РОВНО 4. `get_change_history` ИСКЛЮЧЁН осознанно: он читает НАШ audit-trail из таблицы
        # `proposals` (см. докстринг mcp_server/tools_read.py:377-379), а эта БД живёт на Хосте B и
        # с Хоста A недостижима по построению. Включённый, он давал бы пустой ответ, который агент
        # прочитает как «изменений не было» — худший вид ошибки: уверенный и неверный.
        - list_accounts
        - execute_google_ads_query
        - get_account_audit
        - keyword_ideas

gateway:
  platforms:
    telegram:
      # ⚠️ ОТДЕЛЬНЫЙ бот-токен, НЕ тот, под которым работает денежный бот на Хосте B.
      #
      # ТРИ ОРТОГОНАЛЬНЫХ ГЕЙТА, и путать их дорого [дословно из апстрим-доков
      # website/docs/user-guide/messaging/telegram.md]:
      #   allow_from          — «Global access (DMs + groups). Users here can always invoke the bot»
      #   group_allow_from    — «Sender IDs allowed in groups/forums only. Does NOT grant DM access»
      #   group_allowed_chats — «Entire groups/forums — any member is authorized»
      #
      # ⛔ КЛЮЧИ ГЕЙТОВ ЛЕЖАТ НА УРОВНЕ БЛОКА, А НЕ В `extra:` — И ЭТО НЕ ВОПРОС СТИЛЯ.
      #    Апстрим-ДОКИ показывают все три ВНУТРИ `extra:`. В этом месте доки расходятся с кодом,
      #    и цена расхождения — открытый бот. [Проверено чтением исходника апстрима, ветка main,
      #    21.07 — не доков:]
      #      • YAML → env конвертирует ТОЛЬКО уровень блока:
      #        plugins/platforms/telegram/adapter.py:9391/9396/9401 читает
      #        `telegram_cfg.get("allow_from" | "group_allow_from" | "group_allowed_chats")`,
      #        где `telegram_cfg` — сам блок платформы (gateway/config.py:1551 передаёт его).
      #        Для `reply_to_mode` там же (:9383-9387) есть ЯВНЫЙ фолбэк в `extra` — значит про
      #        `extra` автор знал и для гейтов доступа его сознательно НЕ сделал.
      #      • Решение о доступе принимает gateway/authz_mixin.py::_is_user_authorized, и он
      #        читает ИСКЛЮЧИТЕЛЬНО env: TELEGRAM_ALLOWED_USERS (:381),
      #        TELEGRAM_GROUP_ALLOWED_USERS (:401), TELEGRAM_GROUP_ALLOWED_CHATS (:404).
      #    ⇒ `extra.group_allow_from` не читает НИКТО — ни одного потребителя во всём апстриме.
      #      Это ровно К10: ключ выглядит рабочим и молча не действует. (`extra.allow_from` —
      #      частичное исключение: его читает префильтр адаптера :1017 как «sole authority», но
      #      env он не ставит, то есть работает половина цепи. Полагаться на это нельзя.)
      allow_from: ["REPLACE_USER_ID"]        # → TELEGRAM_ALLOWED_USERS. Числовые id (@userinfobot),
                                             #   НЕ @username
      group_allow_from: ["REPLACE_USER_ID"]  # → TELEGRAM_GROUP_ALLOWED_USERS. КТО командует в группе
      # ⛔ `group_allowed_chats` СОЗНАТЕЛЬНО НЕ ЗАДАН, и это не забывчивость.
      #    В коде он жёстче, чем звучит в доках: authz_mixin.py:344-358 проверяет чат-лист ПЕРВЫМ
      #    и делает `return True` ДО того, как посмотрит на личность отправителя — и даже когда
      #    user_id отсутствует вовсе. Значит он не «дополняет» список людей, а ОТМЕНЯЕТ его:
      #    при заданном чат-листе `group_allow_from` не консультируется никогда.
      #    Прошлая редакция этого файла держала оба ключа сразу и считала, что сендер-лист сужает
      #    доступ. Он его не сужал: агентом управлял каждый, кого когда-либо добавили в группу.
      #    Как работает БЕЗ него: названный в `allow_from` человек авторизован и в группе —
      #    списки объединяются (authz_mixin.py:575-586). Анонимные админы и посты от имени канала
      #    (без user_id) отсекаются (:377-378). Это и есть fail-closed по правилу 10.
      #    Включать его = принять Р2 технически, а не на словах. Тогда — осознанно и письменно.
      # group_allowed_chats: ["REPLACE_SUPERGROUP_ID"]
      require_mention: true
      guest_mode: false
      extra:
        # `group_topics` — наоборот, ТОЛЬКО в `extra`: единственный потребитель читает
        # `self.config.extra.get("group_topics", [])` (adapter.py:9023). На уровне блока
        # он был бы съеден молча — та же К10, зеркально.
        group_topics:
          # Топик = клиент. Это ЕДИНСТВЕННАЯ привязка клиента в схеме, и она **не** ограничивает,
          # какой `customer_id` агент передаст в READ-инструмент: аккаунт заполняет модель
          # (mcp_server/tools_read.py:131). Пер-юзерская изоляция чтения на MCP-путь пока не
          # доведена — держать это в голове при обещаниях заказчику (Р2).
          - chat_id: "REPLACE_SUPERGROUP_ID"
            topics:
              - { name: "REPLACE_CLIENT_NAME", thread_id: 0, skill: REPLACE_SKILL }
              # thread_id — из URL топика в Telegram Web: t.me/c/<id>/<thread_id>

# ── НЕ ВКЛЮЧАТЬ без сверки (К10) ──────────────────────────────────────────────
# Фоновая компрессия на дешёвой модели: при 30 топиках она биллится по цене основной.
# Ключи `auxiliary.*` не верифицированы — раскомментировать только после `hermes config check`.
# auxiliary:
#   compression:
#     model: google/gemini-3.1-flash-lite
#
# ── security: ────────────────────────────────────────────────────────────────
# Прошлая редакция утверждала, что блока `security:` нет намеренно, «потому что это tirith».
# Формулировка была неверна дважды: (1) в блоке живёт не только tirith, (2) отсутствие блока —
# это не «выключено», а «как получится по дефолту апстрима». Правится оба пункта.
security:
  # Регексная редакция ключей/токенов в выводе инструментов И в логах, ДО того как текст войдёт
  # в контекст модели [configuration.md: «On by default»]. Дефолт и так `true` — выписан явно,
  # чтобы смена дефолта в 0.x была видна диффом (Р7).
  # ⛔ Границей НЕ является и правило 5 не заменяет: `developer_token` — голая алфавитно-цифровая
  #    строка, безопасного регекса под неё не существует; вывод по частям или в base64 не ловится
  #    в принципе. Наша защита от утечки токена — его ФИЗИЧЕСКОЕ ОТСУТСТВИЕ на этом хосте.
  redact_secrets: true

  # tirith — сторонний линтер shell-команд. Оставлен ВКЛЮЧЁННЫМ (дефолт `tirith_enabled: true`)
  # как бесплатная ненулевая проверка на хосте, где у агента полный терминал.
  #
  # `tirith_fail_open: true` — это ДЕФОЛТ АПСТРИМА, и мы его сознательно НЕ переворачиваем.
  # Причина не в удобстве, а в том, что `false` покупает вид fail-closed без содержания:
  #   • бинарь докачивается в фоне, и до его появления `false` блокирует ВСЕ команды
  #     (tools/tirith_security.py:765-772) — на Хосте A это выглядит как «агент сломался»;
  #   • ⛔ после ТРЁХ подряд сбоев спавна срабатывает circuit breaker и возвращает `allow`
  #     БЕЗУСЛОВНО, не заглядывая в fail_open вообще (:112 `_CRASH_LIMIT = 3`, :752-753).
  #     То есть fail-closed здесь настройкой недостижим: сломанный бинарь открывает гейт молча.
  # Правилу 10 это не противоречит: правило про НАШИ гейты на денежном пути, а tirith — чужой
  # линтер внутри процесса агента на хосте, где денег нет по построению. Опираться на него нельзя.
  tirith_fail_open: true
