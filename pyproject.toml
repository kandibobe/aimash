[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aimash"
version = "0.0.1"
description = "AI-агент управления Google Ads через Telegram (исполнитель с подтверждением каждого изменения)"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "openai>=1.50",            # клиент к OpenRouter (OpenAI-совместимый)
    # SDK google-ads 31.1.x => API v24/v24.1/v24.2 (lib-версия ≠ API-версия!).
    # 27.x НЕ умеет v24. <32 держит линию v24 (след. мажор lib может выкинуть v24).
    # Релизы ежемесячные → бампить SDK ~раз в месяц (скил gads-version). Сансет v24 ~май 2027.
    "google-ads>=31.1,<32",    # официальный SDK Google Ads API → API v24
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "SQLAlchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "APScheduler>=3.10",
    "cryptography>=43.0",      # Fernet для шифрования токенов at-rest
    "openpyxl>=3.1",           # .xlsx экспорт (фаза 2)
    "Pillow>=10.0",            # подготовка изображений для GDN-объявлений (§11): кроп 1.91:1 / 1:1
    "google-api-python-client>=2.140",  # Sheets API (фаза 2)
    "python-dotenv>=1.0",
    "tenacity>=9.0",           # ретраи/backoff (rate limits Google Ads)
    "sentry-sdk>=2.0",         # мониторинг ошибок (опц.; ВЫКЛ без SENTRY_DSN — core.observability)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",        # покрытие в CI (--cov-report=xml)
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",        # хуки: gitleaks (секрет-скан) + ruff/ruff-format
]

# Плоская раскладка с несколькими top-level пакетами → setuptools НЕ авто-определит их
# (ошибка «Multiple top-level packages discovered»). Перечисляем явно; tests/scripts/migrations —
# не пакеты (в образ всё равно COPY . . попадают, alembic/pytest находят их без установки).
[tool.setuptools.packages.find]
include = ["adcopy*", "ads*", "agent*", "bot*", "confirm*", "core*", "db*", "keywords*", "reports*", "scheduler*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
# Метрика по исходникам, а не по тест/служебным файлам (иначе % искажён).
omit = ["tests/*", "migrations/*", "scripts/*", "*/__init__.py"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true   # google-ads/openai/aiogram без полных стабов
